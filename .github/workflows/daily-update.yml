name: daily-ota-update

on:
  schedule:
    # 每天 22:00 UTC = 北京时间 06:00
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ota/requirements.txt

      - name: Daily OTA query
        env:
          OTA_THREADS: "8"
          OTA_MAX_ROUNDS: "15"
          OTA_MAX_EMPTY: "3"
          OTA_MAX_SEEDS: "3"
          OTA_SERVERS: "1,3,0,2"
        run: python ota/update_daily.py

      - name: Build site data
        run: python tools/build_site_data.py

      - name: Upload database to KV (网站 /api/db)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'EOF'
          import os, urllib.request
          ns = "8f8892fd9545436c9c7b04f965c91db3"
          data = open("database/OPLUS全部版本信息_CN_标准格式.json", encoding="utf-8-sig").read()
          url = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/storage/kv/namespaces/{ns}/values/xsroot_db_v1"
          req = urllib.request.Request(url, data=data.encode("utf-8"), method="PUT")
          req.add_header("Authorization", "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"])
          req.add_header("Content-Type", "application/json; charset=utf-8")
          with urllib.request.urlopen(req, timeout=120) as r:
              print("KV upload:", r.status)
          EOF

      - name: Deploy to EdgeOne Pages (国内)
        uses: TencentEdgeOne/edgeone-pages-action@v1
        with:
          token: ${{ secrets.EDGEONE_API_TOKEN }}
          project-name: oplus-rom-site
          build-path: ./public

      - name: Setup Node.js 22 (wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to Cloudflare Pages (国内主力)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy public --project-name oplus-rom-site

      - name: Commit & push
        run: |
          git config user.name "ota-bot"
          git config user.email "ota-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "daily ota update $(date -u +%Y-%m-%d)"
            git push
          fi
